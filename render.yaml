services:
  - type: web
    name: skill-passport-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: REQUIRE_DATABASE_URL
        value: "true"
      - key: DATABASE_URL
        sync: false
